<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="920" height="500" fill="#ffffff"/>

  <text x="32" y="40" font-size="17" font-weight="700" fill="#16161a">How one action reaches GitHub</text>
  <text x="32" y="62" font-size="13" fill="#6b6b76">The broker gets a token for each action. It keeps no token between actions.</text>

  <!-- operator -->
  <rect x="32" y="96" width="150" height="58" rx="8" fill="#f7f7f9" stroke="#d8d8de"/>
  <text x="107" y="121" font-size="13" font-weight="600" fill="#16161a" text-anchor="middle">Operator</text>
  <text x="107" y="139" font-size="11" fill="#6b6b76" text-anchor="middle">signed in to the app</text>

  <!-- agent -->
  <rect x="32" y="196" width="150" height="58" rx="8" fill="#f7f7f9" stroke="#d8d8de"/>
  <text x="107" y="221" font-size="13" font-weight="600" fill="#16161a" text-anchor="middle">Agent</text>
  <text x="107" y="239" font-size="11" fill="#6b6b76" text-anchor="middle">holds no token</text>

  <!-- broker -->
  <rect x="290" y="150" width="190" height="104" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="385" y="180" font-size="14" font-weight="700" fill="#16161a" text-anchor="middle">Broker</text>
  <text x="385" y="202" font-size="11" fill="#3d3d46" text-anchor="middle">every action passes here</text>
  <text x="385" y="220" font-size="11" fill="#3d3d46" text-anchor="middle">gets a token, uses it once,</text>
  <text x="385" y="238" font-size="11" fill="#3d3d46" text-anchor="middle">then discards it</text>

  <!-- kinde -->
  <rect x="600" y="96" width="190" height="76" rx="8" fill="#f7f7f9" stroke="#d8d8de"/>
  <text x="695" y="123" font-size="13" font-weight="600" fill="#16161a" text-anchor="middle">Kinde Connected Apps</text>
  <text x="695" y="142" font-size="11" fill="#6b6b76" text-anchor="middle">keeps the GitHub grant</text>
  <text x="695" y="159" font-size="11" fill="#6b6b76" text-anchor="middle">and the refresh token</text>

  <!-- github -->
  <rect x="600" y="232" width="190" height="66" rx="8" fill="#f7f7f9" stroke="#d8d8de"/>
  <text x="695" y="259" font-size="13" font-weight="600" fill="#16161a" text-anchor="middle">GitHub</text>
  <text x="695" y="278" font-size="11" fill="#6b6b76" text-anchor="middle">the comment appears as the user</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d3d46"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
  </defs>

  <!-- operator -> agent -->
  <path d="M 107 154 L 107 196" stroke="#3d3d46" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="117" y="180" font-size="11" fill="#3d3d46">writes a task</text>

  <!-- agent -> broker -->
  <path d="M 182 225 L 290 208" stroke="#3d3d46" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="196" y="211" font-size="11" fill="#3d3d46">proposes an action</text>

  <!-- broker -> kinde -->
  <path d="M 480 178 L 600 140" stroke="#3d3d46" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="492" y="150" font-size="11" fill="#3d3d46">1. asks for a token</text>

  <!-- kinde -> broker -->
  <path d="M 600 160 L 480 196" stroke="#3d3d46" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="486" y="192" font-size="11" fill="#3d3d46">2. one short-life token</text>

  <!-- broker -> github -->
  <path d="M 480 240 L 600 262" stroke="#3d3d46" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="492" y="266" font-size="11" fill="#3d3d46">3. acts as the user</text>

  <!-- storage note -->
  <rect x="290" y="286" width="190" height="46" rx="8" fill="#e6f4ea" stroke="#157f3d"/>
  <text x="385" y="305" font-size="11.5" font-weight="600" fill="#157f3d" text-anchor="middle">The app keeps</text>
  <text x="385" y="322" font-size="11.5" font-weight="600" fill="#157f3d" text-anchor="middle">no GitHub token</text>

  <!-- revocation band -->
  <line x1="32" y1="368" x2="888" y2="368" stroke="#e3e3e8" stroke-width="1"/>
  <text x="32" y="396" font-size="14" font-weight="700" fill="#16161a">When the operator revokes the connection</text>

  <rect x="32" y="412" width="330" height="58" rx="8" fill="#fdecea" stroke="#b3261e"/>
  <text x="197" y="434" font-size="12" font-weight="600" fill="#b3261e" text-anchor="middle">Kinde gives no more tokens.</text>
  <text x="197" y="453" font-size="12" font-weight="600" fill="#b3261e" text-anchor="middle">The broker refuses the next action.</text>

  <path d="M 362 441 L 452 441" stroke="#b3261e" stroke-width="1.6" fill="none" marker-end="url(#r)"/>

  <rect x="452" y="412" width="436" height="58" rx="8" fill="#f7f7f9" stroke="#d8d8de"/>
  <text x="670" y="434" font-size="12" fill="#3d3d46" text-anchor="middle">A token that GitHub already issued stays valid until it expires.</text>
  <text x="670" y="453" font-size="12" fill="#3d3d46" text-anchor="middle">To cancel that token, the operator revokes it on GitHub.</text>
</svg>
